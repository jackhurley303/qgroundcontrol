name: MacOS

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read
  security-events: write

env:
  IS_STABLE_BUILD: ${{ (github.ref_type == 'tag' || contains(github.ref, 'Stable')) && 'true' || 'false' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: macos

  build:
    needs: changes
    if: always() && !cancelled() && (needs.changes.outputs.should_build == 'true' || needs.changes.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ inputs.build_type && fromJSON(format('["{0}"]', inputs.build_type)) || fromJSON('["Release"]') }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Build Setup
        id: setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: mac
          qt-arch: clang_64
          build-type: ${{ matrix.build_type }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.setup.outputs.xcode_version }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: CMake configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}
          stable: ${{ env.IS_STABLE_BUILD }}
          testing: 'true'
          extra-args: -DQGC_MACOS_SIGN_WITH_IDENTITY=${{ github.event_name != 'pull_request' && 'ON' || 'OFF' }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}

      # TODO: Enable GStreamer integration tests once a Debug build is added to the matrix.
      # QGC_BUILD_TESTING=ON (above) does compile test infra into a Release build fine —
      # PluginLoaderGateTest below proves it — but GStreamer integration specifically still
      # needs a Debug/RelWithDebInfo build for other reasons; out of scope here.
      # - name: Run GStreamer Integration Tests
      #   uses: ./.github/actions/run-unit-tests
      #   with:
      #     build-dir: ${{ runner.temp }}/build
      #     include-labels: 'Integration'

      - name: Verify dev build executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/QGroundControl.app/Contents/MacOS/QGroundControl
          build-dir: ${{ runner.temp }}/build

      - name: Import Code Signing Certificate
        if: github.event_name != 'pull_request'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_P12_PASSWORD }}

      - name: Create signed/notarized/stapled app bundle
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config ${{ matrix.build_type }}
        env:
          QGC_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          QGC_MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          QGC_MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          QGC_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}

      - name: Create unsigned app bundle
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config ${{ matrix.build_type }}

      - name: Mount DMG
        working-directory: ${{ runner.temp }}/build
        run: |
          if ! hdiutil attach QGroundControl.dmg; then
            echo "::error::Failed to mount DMG"
            ls -la QGroundControl.dmg 2>/dev/null || echo "DMG file not found"
            exit 1
          fi

      - name: Verify DMG executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: /Volumes/QGroundControl/QGroundControl.app/Contents/MacOS/QGroundControl

      - name: Attest and Upload
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: QGroundControl.dmg
          package-name: QGroundControl
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}

      # Plugin SDK (plugins/.architecture/04-macos-implementation-plan.md U2.7): the
      # "never build QGC" artifact — a separate, isolated install pass (--component
      # selects only QGCPluginSDK's install() rules, skipping the app bundle/DMG ones)
      # packed into its own zip, independent of QGroundControl.dmg above.
      - name: Package plugin SDK
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.temp }}/build
        run: |
          SDK_VERSION=$(cat qgc-plugin-sdk-version.txt)
          SDK_NAME="qgc-plugin-sdk-macos-${SDK_VERSION}"
          cmake --install . --config ${{ matrix.build_type }} --component QGCPluginSDK --prefix "${SDK_NAME}"
          ditto -c -k --sequesterRsrc --keepParent "${SDK_NAME}" "${SDK_NAME}.zip"
          echo "SDK_ZIP=${SDK_NAME}.zip" >> "$GITHUB_ENV"
          echo "SDK_NAME=${SDK_NAME}" >> "$GITHUB_ENV"

      # Plugin SDK ABI watchdog (plugins/.architecture/05-completion-plan.md U5.1): the
      # permanent "different-commit-host" proof (DoD #1's residue, 04 §11 Spike S3). Leg 1
      # loads a frozen, git-committed golden Example-plugin dylib (test/PluginSystem/golden/,
      # built at an earlier commit) through today's QGCPluginLoader. Leg 2 builds
      # plugins/template/ standalone against the SDK just packaged above and loads that.
      # Both run through PluginLoaderGateTest's env-var-gated slots; a real ABI break here
      # crashes loudly (verified manually — see the golden README) rather than passing
      # silently, so this must run on PRs too, not just Release pushes.
      - name: Build SDK-template plugin against the just-packaged SDK
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.temp }}/build
        run: |
          cmake -B template-build -S "${SDK_NAME}/template" \
            -DCMAKE_PREFIX_PATH="$(pwd)/${SDK_NAME};${QT_ROOT_DIR}" \
            -DCMAKE_TOOLCHAIN_FILE="${QT_ROOT_DIR}/lib/cmake/Qt6/qt.toolchain.cmake"
          cmake --build template-build
          echo "TEMPLATE_PLUGIN_PATH=$(pwd)/template-build/libMyPlugin.dylib" >> "$GITHUB_ENV"

      - name: Run golden-plugin ABI watchdog (PluginLoaderGateTest)
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.temp }}/build
        env:
          QGC_GOLDEN_PLUGIN_PATH: ${{ github.workspace }}/test/PluginSystem/golden/ExamplePlugin-v2.dylib
          QGC_TEMPLATE_PLUGIN_PATH: ${{ env.TEMPLATE_PLUGIN_PATH }}
        run: |
          "${{ matrix.build_type }}/QGroundControl.app/Contents/MacOS/QGroundControl" \
            --unittest:PluginLoaderGateTest --unittest-output:golden-plugin-results.xml

      - name: Attest and Upload plugin SDK
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ env.SDK_ZIP }}
          package-name: QGCPluginSDK-macos
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}
