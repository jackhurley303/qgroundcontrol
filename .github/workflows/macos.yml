name: MacOS

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: macos

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: macos-15
    timeout-minutes: 120

    # id-token/attestations scoped here: only the attestation upload step needs them.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        build_type: ['${{ inputs.build_type || ''Release'' }}']

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Build Setup
        id: setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: mac
          qt-arch: clang_64
          build-type: ${{ matrix.build_type }}

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: CMake configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}
          testing: 'true'
          extra-args: -DQGC_MACOS_SIGN_WITH_IDENTITY=${{ github.event_name != 'pull_request' && 'ON' || 'OFF' }}

      - name: Build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}

      # TODO: Enable GStreamer integration tests once a Debug build is added to the matrix.
      # QGC_BUILD_TESTING=ON (above) does compile test infra into a Release build fine —
      # PluginLoaderGateTest below proves it — but GStreamer integration specifically still
      # needs a Debug/RelWithDebInfo build for other reasons; out of scope here.
      # - name: Run GStreamer Integration Tests
      #   uses: ./.github/actions/run-unit-tests
      #   with:
      #     build-dir: ${{ runner.temp }}/build
      #     include-labels: 'Integration'

      - name: Verify dev build executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/QGroundControl.app/Contents/MacOS/QGroundControl
          build-dir: ${{ runner.temp }}/build

      - name: Import Code Signing Certificate
        if: github.event_name != 'pull_request'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_P12_PASSWORD }}

      # PRs configure with QGC_MACOS_SIGN_WITH_IDENTITY=OFF, so the signing env vars are unused there — leaving them resolved-but-empty is harmless and lets us avoid duplicating the install step.
      - name: Create app bundle
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}
        env:
          QGC_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          QGC_MACOS_NOTARIZATION_USERNAME: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          QGC_MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          QGC_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}

      - name: Mount DMG
        working-directory: ${{ runner.temp }}/build
        run: |
          if ! hdiutil attach QGroundControl.dmg; then
            echo "::error::Failed to mount DMG"
            ls -la QGroundControl.dmg 2>/dev/null || echo "DMG file not found"
            exit 1
          fi

      - name: Verify DMG executable
        uses: ./.github/actions/verify-executable
        with:
          binary-path: /Volumes/QGroundControl/QGroundControl.app/Contents/MacOS/QGroundControl

      - name: Attest and Upload
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: QGroundControl.dmg
          package-name: QGroundControl
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}

      # Plugin SDK: the "never build QGC" artifact — a separate, isolated install pass
      # (--component selects only QGCPluginSDK's install() rules, skipping the app
      # bundle/DMG ones) packed into its own zip, independent of QGroundControl.dmg above.
      - name: Package plugin SDK
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.temp }}/build
        run: |
          SDK_VERSION=$(cat qgc-plugin-sdk-version.txt)
          SDK_NAME="qgc-plugin-sdk-macos-${SDK_VERSION}"
          cmake --install . --config ${{ matrix.build_type }} --component QGCPluginSDK --prefix "${SDK_NAME}"
          ditto -c -k --sequesterRsrc --keepParent "${SDK_NAME}" "${SDK_NAME}.zip"
          echo "SDK_ZIP=${SDK_NAME}.zip" >> "$GITHUB_ENV"
          echo "SDK_NAME=${SDK_NAME}" >> "$GITHUB_ENV"

      # Out-of-tree verifier (out-of-tree-verifier.md U3): the single plugin-agnostic
      # gate that replaces the two hand-maintained inline steps this comment used to
      # sit above (a bespoke standalone build, a bespoke qmllint invocation + negative
      # control). Same proof, one SDK-shipped implementation: builds plugins/example
      # standalone against the just-packaged SDK with no QGC source in its scratch
      # tree, then runs its Qt-component, QML-lint and negative-control axes per
      # plugins/example/plugin-verify.json. --keep retains the scratch tree (and the
      # built artifact) past a successful run, since the ABI watchdog step below needs
      # the dylib to still exist; --report-json is how it hands that path over.
      - name: Verify plugin builds and lints out-of-tree (plugins/example)
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.temp }}/build
        run: |
          python3 "${{ github.workspace }}/tools/verify_plugin_out_of_tree.py" \
            "${{ github.workspace }}/plugins/example" \
            --sdk "$(pwd)/${SDK_NAME}" \
            --qt-root "${QT_ROOT_DIR}" \
            --keep \
            --report-json out-of-tree-report.json
          echo "TEMPLATE_PLUGIN_PATH=$(python3 -c 'import json; print(json.load(open("out-of-tree-report.json"))["artifact"])')" >> "$GITHUB_ENV"

      # Plugin SDK ABI watchdog: the permanent "different-SDK-zip-host" proof. Loads
      # the verifier's standalone-built artifact through PluginLoaderGateTest's
      # env-var-gated slot; a real ABI break here crashes loudly rather than passing
      # silently, so this must run on PRs too, not just Release pushes.
      - name: Run SDK-example ABI watchdog (PluginLoaderGateTest)
        if: matrix.build_type == 'Release'
        working-directory: ${{ runner.temp }}/build
        env:
          QGC_TEMPLATE_PLUGIN_PATH: ${{ env.TEMPLATE_PLUGIN_PATH }}
        run: |
          "${{ matrix.build_type }}/QGroundControl.app/Contents/MacOS/QGroundControl" \
            --unittest:PluginLoaderGateTest --unittest-output:sdk-example-plugin-results.xml

      # QML contract watchdog (out-of-tree-plugins.md U5): the QML analogue of the
      # ABI watchdog above. There is no vtable on this surface, so a renamed
      # property on a frozen-tier control fails silently at panel-load time in
      # someone else's build instead of loudly here — this diffs the just-derived
      # module against the committed golden snapshot to catch that before it ships.
      - name: Check QML contract (frozen-tier watchdog)
        if: matrix.build_type == 'Release'
        run: |
          python3 tools/check_plugin_ui_contract.py \
            --golden test/PluginSystem/golden \
            --current "${{ runner.temp }}/build/plugin-sdk/qml/QGroundControl/PluginUI"

      - name: Attest and Upload plugin SDK
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: ${{ env.SDK_ZIP }}
          package-name: QGCPluginSDK-macos
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}
